# Espèces suivies par Mushroomator.
#
# hotes : aptitude (0 à 1) de chaque groupe de formations végétales de la BD Forêt V2 à héberger l'espèce
#         (voir mushroomator/sources/bdforet.py pour la correspondance avec les classes IGN).
#         Valeurs a priori tirées de la littérature mycologique ; à ajuster selon votre expérience.
# ph    : [pH où l'aptitude vaut `ph_bas`, pH où elle vaut 1] pour une préférence acide (premier > second)
#         ou calcaire (premier < second) ; transition linéaire entre les deux.
# altitude : [min, optimum bas, optimum haut, max] en mètres (trapèze adouci).
# gbif  : noms scientifiques utilisés pour l'entraînement et la validation.

[cepe]
nom = "Cèpe de Bordeaux"
latin = "Boletus edulis"
gbif = ["Boletus edulis"]
ph = [7.5, 6.0]
ph_bas = 0.6
altitude = [100, 300, 1700, 2100]
confusions = "Bolet amer (immangeable), bolets à pores rouges (certains toxiques)."
[cepe.hotes]
chene_decidu = 0.8
chene_sempervirent = 0.3
hetre = 1.0
chataignier = 0.9
robinier = 0.05
peupleraie = 0.05
feuillu_autre = 0.4
feuillus_melange = 0.8
pin_sylvestre = 0.8
pin_noir = 0.5
pin_autre = 0.5
pin_montagne = 0.5
sapin_epicea = 1.0
meleze = 0.4
douglas = 0.5
conifere_autre = 0.7
mixte_feuillus = 0.9
mixte_coniferes = 1.0
sans_couvert = 0.1
lande = 0.1
herbacee = 0.0

[girolle]
nom = "Girolle"
latin = "Cantharellus cibarius"
gbif = ["Cantharellus cibarius"]
# Réputée acidophile, mais en Rhône-Alpes les observations ne sont pas sur des sols plus acides que celles des
# autres champignons forestiers (validation 2026) : pas de préférence de pH.
ph = [7.5, 5.5]
ph_bas = 1.0
altitude = [0, 100, 1500, 1900]
confusions = "Clitocybe de l'olivier (toxique, confusion n° 1 en France en 2024), fausse girolle."
