# Daily weather update and publication of the map on GitHub Pages, also run when the application changes.
# One-time setting: Settings → Pages → Source: "GitHub Actions". Until then, only the tests run.
name: Mise à jour de la carte

on:
  schedule:
    # GitHub sometimes starts scheduled runs hours late (25/10/2026: the 04:17 UTC run started at 09:08) or drops them:
    # three attempts every night, the first one that succeeds publishes the map of the day and the others do nothing
    - cron: "17 1 * * *"
    - cron: "47 3 * * *"
    - cron: "17 6 * * *"
  push:
    paths: ["web/**", "mushroomator/**", "assets/**", "pyproject.toml", ".github/workflows/carte.yml"]
  workflow_dispatch:

permissions:
  actions: read           # earlier runs of the day
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # ~7 min normally; a stuck download must not hold back the next runs for 6 h
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

      - name: Faut-il publier ?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null) || source=""
          day=$(TZ=Europe/Paris date +%F)                          # same day as mushroomator.weather.fetch
          midnight=$(date -u -d "TZ=\"Europe/Paris\" $day" +%FT%TZ)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          # latest successful nightly run or "Run workflow" (when unknown, the nightly run publishes anyway)
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/carte.yml/runs?branch=$default&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | .created_at] | max // ""') || last=""
          echo "Dernière mise à jour quotidienne ou manuelle réussie : ${last:-inconnue}"
          if [ "$GITHUB_REF_NAME" != "$default" ]; then
            echo "::notice::Branche $GITHUB_REF_NAME : tests seulement, la carte est publiée depuis $default."
          elif [ "$source" != "workflow" ]; then
            echo "::warning title=Carte non publiée::Activez GitHub Pages (Settings → Pages → Source : GitHub Actions), puis relancez ce workflow."
          elif [ "$GITHUB_EVENT_NAME" = schedule ] && [[ "$last" > "$midnight" ]]; then
            echo "::notice::Carte du $day déjà publiée : rien à faire."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # the nightly run and "Run workflow" always download the weather (latest forecast); a run for a change of the
      # application reuses the latest download of the day
      - id: weather
        if: steps.pages.outputs.publish == 'true' && github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: data/weather
          key: meteo-${{ steps.pages.outputs.day }}-${{ github.run_id }}
          restore-keys: meteo-${{ steps.pages.outputs.day }}-
      - if: steps.pages.outputs.publish == 'true'
        run: python -m mushroomator update
      - if: steps.pages.outputs.publish == 'true' && steps.weather.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: data/weather
          key: meteo-${{ steps.pages.outputs.day }}-${{ github.run_id }}
      - if: steps.pages.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
