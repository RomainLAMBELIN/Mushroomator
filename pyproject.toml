[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mushroomator"
version = "0.1.0"
description = "Carte de chaleur des champignons comestibles à partir de la météo, des forêts et des sols."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "requests>=2.31",
]

[project.optional-dependencies]
# Rebuilding the static layers and retraining the models (not needed for the daily update).
build = ["rasterio>=1.3", "pyogrio>=0.7", "pyproj>=3.6", "shapely>=2.0", "py7zr>=0.20", "affine>=2.4",
         "xarray>=2024.1", "netCDF4>=1.6"]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
mushroomator = "mushroomator.__main__:main"

[tool.setuptools]
packages = ["mushroomator", "mushroomator.sources"]

[tool.setuptools.package-data]
mushroomator = ["species.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
